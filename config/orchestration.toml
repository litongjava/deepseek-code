# =============================================================================
# DeepSeek Code Desktop Tauri — Orchestration Configuration
# =============================================================================
# Engine tunables previously hard-coded across the codebase are centralised
# here.  The application reads this file at startup and caches the values in
# the global OrchestrationConfig (crates/core/src/config/mod.rs).
# The multi-agent orchestrator's own settings (concurrency, scheduling,
# workflow switches) are not kept here: they live in orchestrator.toml in the
# data directory and are edited through /api/workflow/config.
# =============================================================================

[tool_loop]
# Maximum number of back-and-forth tool-calling iterations per turn.
# Unset means unlimited: a turn runs until the model stops calling tools or
# the user interrupts it. Set a positive number to cap long turns.
# max_tool_iterations = 50

# Token threshold at which automatic context compression triggers.
# Reduced from 2.5M to 600K to stay safely below most models' context limits.
token_threshold = 600_000

# Context compression: keep this many most-recent messages untouched.
recent_messages_to_keep = 10

# Default max_tokens sent to the model when not otherwise specified.
default_max_tokens = 12288

[tools]
# Maximum bytes a tool output can produce before being truncated.
max_output_bytes = 102400    # 100 KiB

# Default timeout (seconds) for Bash commands.
default_bash_timeout_secs = 60

[tools.computer_use]
# Virtual display dimensions.
display_width = 1920
display_height = 1080

[memory]
# Whether the memory subsystem is enabled by default.
enabled = true

[bridge]
# Internal bridge server port (connects webview ↔ native engine).
port = 30085

[http]
# Model streaming idle timeout in seconds. Must be positive.
# A stream has no total deadline: this bounds each read instead, so a long
# answer stays connected while bytes keep arriving. It covers waiting for the
# response headers and silence in the response body, including SSE comments,
# split event frames and split UTF-8 sequences. Buffered model requests keep a
# fixed 300-second total deadline of their own.
request_timeout_secs = 300

# How long an idle keep-alive connection stays in the process-wide shared model
# client pools (in seconds). Must be positive. Reuse only happens for the same
# scheme + host + port while the connection is still idle; servers may close it
# earlier. Read when each shared client is first built (restart required for
# changes to take effect).
pool_idle_timeout_secs = 300

# Maximum retries for transient HTTP errors (429, 5xx).
max_retries = 7

# Base backoff in milliseconds (2, 4, 8, 16, 32, 64, 128 seconds).
retry_base_backoff_ms = 2000

# Opt-in: replay one model step that stalls after text, reasoning or tool
# arguments arrived but before the stream completed. Only the current
# uncommitted step is discarded and reissued, at most once per turn. The
# replay waits one backoff, emits a visible notice, and never follows a
# terminal marker, a provider error or a spent retry budget. While enabled,
# a step's text and thinking appear when it completes instead of live.
# Trailing `false` keeps today's behaviour: partial output is retained and
# the turn fails.
post_content_timeout_recovery = false

[logging]
# Log level: trace, debug, info, warn, error.
level = "info"

# Write logs to this directory (set to "" to disable file logging).
log_dir = ""

[telemetry]
# OpenTelemetry exporter endpoint (set to "" to disable).
otlp_endpoint = ""
