name: Build dcl and dcd

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: macos-15
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            pkg-config \
            curl \
            wget \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build dcl, dcd and installers
        run: npm run build:all

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts\* -DestinationPath "dcl-dcd-${{ matrix.artifact }}.zip" -Force

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf "dcl-dcd-${{ matrix.artifact }}.tar.gz" -C artifacts .

      - uses: actions/upload-artifact@v4
        with:
          name: dcl-dcd-${{ matrix.artifact }}
          path: dcl-dcd-${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "$tag" --generate-notes
          fi
