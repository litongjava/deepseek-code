[package]
name = "deepseek-code-cli"
version.workspace = true
edition.workspace = true
description = "Standalone terminal frontend for the shared DeepSeek Code engine"
license = "MIT"

[[bin]]
name = "dcl"
path = "src/main.rs"

[dependencies]
deepseek-code-core = { path = "../core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
rustyline = { version = "15", default-features = false }
crossterm = "0.28"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
axum = "0.8"
tempfile = "3"
ring = "0.17"
portable-pty = "0.9"
vt100 = "0.16"
base64 = "0.22"
tracing = "0.1"
vte = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
# The workflow script engine; the crate ships no Android bindings.
rquickjs = { version = "0.14.0", features = ["futures", "macro"] }
# Microphone capture; Android has no input device for a terminal program.
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
# Native clipboard access: Ctrl+V images (PNG, bitmaps and copied image
# files) without spawning PowerShell, and fast text copy for selections.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
png = "0.18"

[dev-dependencies]
axum = "0.8"
