[package]
name = "deepseek-code-cli"
version.workspace = true
edition.workspace = true
description = "Standalone terminal frontend for the shared DeepSeek Code engine"
license = "MIT"

[[bin]]
name = "dcl"
path = "src/main.rs"

[dependencies]
deepseek-code-core = { path = "../core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
rustyline = { version = "15", default-features = false }
crossterm = "0.28"
unicode-width = "0.2"
cpal = "0.15"
axum = "0.8"
tempfile = "3"
rquickjs = { version = "0.14.0", features = ["futures", "macro"] }
ring = "0.17"
portable-pty = "0.9"
vt100 = "0.16"
base64 = "0.22"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
