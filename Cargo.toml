[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri", "src-tauri/worker"]
default-members = ["crates/core", "crates/cli"]
exclude = ["legacy/claude-code-cli", "vendor/crossterm"]

[patch.crates-io]
# The Unix event reader must return on a disconnected terminal.
crossterm = { path = "vendor/crossterm" }

[workspace.package]
version = "3.1.0"
edition = "2021"

# Keep line tables for useful test failures without the full variable debug
# information that dominates link time on Windows.
[profile.dev]
debug = 1

[profile.test]
debug = 1
